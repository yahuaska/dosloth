# An example configuration for the emulator: python -m dosloth -c config.example.toml PROGRAM
#
# A drive and the medium in it are described apart. [disks] says what kind of device each drive is, and
# [mounts] says what is in it. A drive with no entry in [mounts] has nothing in it, like an empty floppy
# drive; only a floppy or a CD-ROM drive may be left empty, a hard disk must have something in it.
#
# Relative paths are taken from the directory this file is in.

# Where the program starts: a drive and a directory, inside DOS. Single quotes keep the backslash as it is.
cwd = 'C:\'

[disks.A]
type = "floppy"      # a floppy drive, with no disk in it

[disks.B]
type = "floppy"

[disks.C]
type = "hdd"         # a hard disk: it must have something mounted

[disks.D]
type = "cdrom"       # a CD-ROM drive: what is mounted in it can never be written to

[mounts]
B = { type = "tmpfs" }                                  # a floppy in memory: gone when the emulator exits
C = { type = "dir", path = "." }                        # the directory of this file is the root of C:
D = { type = "dir", path = "samples" }                  # a disc: the files of this directory
# D = { type = "iso", path = "game.iso" }               # or an image of a disc: its files, and its sectors for the
#                                                       # programs that read them (a directory has no sectors)
